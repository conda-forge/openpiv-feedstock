name: Build conda package
on:
  workflow_dispatch:

jobs:
  build:
    name: Build conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: conda-incubator/setup-miniconda@v2
