{% set version = "0.26.2" %}

package:
  name: openpiv
  version: {{ version }}

source:
  fn: openpiv-{{ version }}.tar.gz
  url: https://github.com/OpenPIV/openpiv-python/archive/v{{ version }}.tar.gz
  sha256: 6b37d0e678c9240a3789f386229470bb4d44ea983bd3504ef1c40be85a415a70

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - poetry-core
  run:
    - python
    - numpy
    - scikit-image
    - imageio
    - matplotlib-base
    - scipy
    - natsort
    - tqdm

test:
  imports:
    - openpiv
  requires:
    - pytest
    - python
  commands:
    - pytest -v --pyargs openpiv

about:
  home: https://github.com/openpiv/openpiv-python
  license: GPL-3.0-only
  license_file: LICENSE.txt
  summary: Open Source Particle Image Velocimetry
  doc_url: http://openpiv.readthedocs.io/

extra:
  recipe-maintainers:
    - alexlib
